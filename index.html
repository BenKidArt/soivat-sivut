<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb6">
<meta name="description" content="Soivat Sivut – värikäs musiikkikirja lapsille. Paina soitinta ja kuuntele!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Soivat Sivut</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --h1 { syntax: '<number>'; inherits: true; initial-value: 330; }
@property --h2 { syntax: '<number>'; inherits: true; initial-value: 50; }

:root {
  --h1: 330;
  --h2: 50;
  --ink: #2b1846;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  transition: --h1 .8s ease, --h2 .8s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
  color: var(--ink);
  background: hsl(var(--h1) 90% 72%);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }

/* ─── Pyörivä aurinkotausta ─── */
#sun {
  position: fixed;
  left: 50%; top: 46%;
  width: 260vmax; height: 260vmax;
  margin: -130vmax 0 0 -130vmax;
  background: repeating-conic-gradient(
    hsl(var(--h1) 95% 72%) 0deg 10deg,
    hsl(var(--h2) 98% 72%) 10deg 20deg);
  will-change: transform;
  z-index: 0;
}
#glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 46%, rgba(255,255,255,.7) 0, rgba(255,255,255,.25) 32%, transparent 62%);
}
canvas { position: fixed; left: 0; top: 0; pointer-events: none; }
#bg { z-index: 1; }
#fx { z-index: 5; }

.screen { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; }
.screen[hidden] { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinBack { to { transform: rotate(-360deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14%) rotate(4deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-7deg) scale(1); } 50% { transform: rotate(7deg) scale(1.04); } }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* ─── Kotisivu ─── */
#home {
  align-items: center;
  overflow-y: auto;
  padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
}
.logo {
  font-size: clamp(42px, 12vw, 92px);
  font-weight: 700;
  line-height: 1.05;
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 0 .3em;
  margin: 10px 0 2px;
  text-align: center;
}
.logo .word { display: flex; }
.logo span.ch {
  display: inline-block;
  color: hsl(calc(var(--i) * 37) 90% 55%);
  -webkit-text-stroke: .16em #fff;
  paint-order: stroke fill;
  text-shadow: 0 .09em 0 rgba(0,0,0,.12);
  animation: hop 1.8s ease-in-out infinite;
  animation-delay: calc(var(--i) * -.14s);
}
.tagline {
  font-size: clamp(17px, 4.2vw, 24px);
  font-weight: 500;
  background: #fff;
  padding: 6px 18px;
  border-radius: 999px;
  box-shadow: 0 5px 0 rgba(0,0,0,.1);
  margin: 6px 0 10px;
  text-align: center;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(40vw, 150px), 1fr));
  gap: 16px 12px;
  width: 100%;
  max-width: 920px;
  padding: 12px 0 8px;
}
.bubble { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.bubble .bw {
  position: relative;
  width: min(34vw, 132px);
  aspect-ratio: 1;
  animation: bob 3s ease-in-out infinite;
  animation-delay: var(--d);
}
.bubble .ring {
  position: absolute; inset: -9px; border-radius: 50%;
  background: repeating-conic-gradient(hsl(var(--h) 95% 58%) 0 15deg, #fff 15deg 30deg);
  animation: spin 7s linear infinite;
}
.bubble .disc {
  position: absolute; inset: 0; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff 0, hsl(var(--h) 95% 86%) 40%, hsl(var(--h) 85% 66%) 100%);
  box-shadow: inset 0 -8px 0 rgba(0,0,0,.08);
}
.bubble .art { font-size: min(18vw, 72px); }
.bubble .label {
  font-weight: 700;
  font-size: clamp(17px, 4.4vw, 22px);
  background: #fff;
  padding: 2px 14px;
  border-radius: 999px;
  box-shadow: 0 4px 0 hsl(var(--h) 70% 50%);
}
.bubble:active .bw { transform: scale(.92); }

/* ─── Soitinsivu ─── */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
}
.top .group { display: flex; gap: 8px; }
.iconbtn {
  width: 54px; height: 54px; flex: none;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 5px 0 rgba(0,0,0,.15);
  font-size: 26px; font-family: var(--emoji);
  display: grid; place-items: center;
  transition: transform .1s, box-shadow .1s, opacity .2s;
}
.iconbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.iconbtn.off { opacity: .45; }
.iconbtn[hidden] { display: none; }
.dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; min-width: 0; }
.dots i {
  width: 12px; height: 12px; border-radius: 50%;
  background: rgba(255,255,255,.65);
  box-shadow: 0 2px 0 rgba(0,0,0,.12);
  transition: transform .3s, background .3s;
}
.dots i.on { background: #fff; transform: scale(1.5); }

.middle {
  flex: 1; min-height: 0;
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  touch-action: pan-y;
}
.stagewrap { display: flex; flex-direction: column; align-items: center; }
.name {
  font-size: clamp(34px, min(10vw, 8vh), 76px);
  font-weight: 700;
  line-height: 1.1;
  color: #fff;
  -webkit-text-stroke: .17em hsl(var(--h1) 75% 42%);
  paint-order: stroke fill;
  text-shadow: 0 .1em 0 rgba(0,0,0,.12);
  margin-bottom: 4px;
}
.stage {
  position: relative;
  width: min(62vw, 44vh, 420px);
  aspect-ratio: 1;
  margin: 10px 0;
}
.stage .ring1, .stage .ring2 { position: absolute; border-radius: 50%; pointer-events: none; }
.stage .ring1 {
  inset: -9%;
  background: repeating-conic-gradient(#fff 0 7deg, transparent 7deg 18deg);
  -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%, #000 70%, transparent 71%);
          mask: radial-gradient(circle, transparent 60%, #000 61%, #000 70%, transparent 71%);
  animation: spin 14s linear infinite;
}
.stage .ring2 {
  inset: -3%;
  background: repeating-conic-gradient(hsl(var(--h1) 90% 55%) 0 10deg, hsl(var(--h2) 95% 55%) 10deg 20deg);
  animation: spinBack 9s linear infinite;
}
.stage .disc {
  position: absolute; inset: 3%;
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff 0, hsl(var(--h2) 100% 88%) 42%, hsl(var(--h2) 92% 66%) 100%);
  box-shadow: inset 0 -12px 0 rgba(0,0,0,.08), 0 14px 30px rgba(0,0,0,.2);
}
.stage .artwrap { display: grid; place-items: center; }
.stage .art {
  font-size: min(34vw, 25vh, 230px);
  animation: sway 3.2s ease-in-out infinite;
  filter: drop-shadow(0 8px 0 rgba(0,0,0,.14));
}
.art { font-family: var(--emoji); line-height: 1; display: inline-grid; place-items: center; }
.art svg { width: 1em; height: 1em; display: block; }

.say {
  position: absolute;
  top: -2%; right: -8%;
  background: #fff;
  padding: .25em .7em;
  border-radius: 1em;
  font-size: clamp(20px, 5vw, 34px);
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 6px 0 rgba(0,0,0,.12);
  transform: scale(0);
  pointer-events: none;
  z-index: 2;
}
.say::after {
  content: ''; position: absolute; left: 22%; bottom: -12px;
  border: 12px solid transparent; border-top-color: #fff; border-bottom: 0;
}
.hint {
  font-size: clamp(18px, 4.5vw, 26px);
  font-weight: 700;
  color: #fff;
  -webkit-text-stroke: .16em var(--ink);
  paint-order: stroke fill;
  animation: nudge 1.2s ease-in-out infinite;
  min-height: 1.3em;
}
.hint.gone { visibility: hidden; }

.navbtn {
  position: absolute; top: 50%;
  width: 60px; height: 60px; margin-top: -30px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 5px 0 rgba(0,0,0,.15);
  font-size: 34px; font-weight: 700; line-height: 1;
  display: grid; place-items: center;
  z-index: 3;
}
.navbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
#prev { left: max(8px, env(safe-area-inset-left)); }
#next { right: max(8px, env(safe-area-inset-right)); }

.pads {
  display: flex; justify-content: center;
  gap: clamp(6px, 2vw, 14px);
  padding: 6px max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  touch-action: none;
}
.pad {
  flex: 1 1 0; max-width: 104px;
  height: clamp(62px, 13vh, 112px);
  border-radius: 22px;
  background: radial-gradient(circle at 35% 25%, hsl(var(--c) 100% 80%), hsl(var(--c) 90% 58%) 60%);
  box-shadow: 0 7px 0 hsl(var(--c) 70% 38%), 0 12px 18px rgba(0,0,0,.15);
  color: #fff;
  font-weight: 700;
  font-size: clamp(16px, 4.2vw, 24px);
  text-shadow: 0 2px 0 hsl(var(--c) 70% 35%);
  display: grid; place-items: center;
}

/* Aloituspeitto: ääni vaatii ensimmäisen kosketuksen */
#start {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  background: rgba(255,255,255,.2);
}
#start[hidden] { display: none; }
#start button {
  width: min(56vw, 240px); aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #ffe066 45%, #ff9f1c);
  box-shadow: 0 10px 0 #d9730d, 0 20px 40px rgba(0,0,0,.2);
  font-size: min(22vw, 96px);
  display: grid; place-items: center;
  animation: bob 1.6s ease-in-out infinite;
  position: relative;
}
#start button::before {
  content: ''; position: absolute; inset: -16px; border-radius: 50%; z-index: -1;
  background: repeating-conic-gradient(#fff 0 12deg, #ff5d8f 12deg 24deg);
  animation: spin 5s linear infinite;
}
#start .play { width: 0; height: 0; border-style: solid; border-width: .5em 0 .5em .82em; border-color: transparent transparent transparent #fff; margin-left: .18em; filter: drop-shadow(0 4px 0 rgba(0,0,0,.15)); }

/* ─── Arvauspeli ─── */
.gamebtn {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 0 6px;
  padding: 10px 26px 10px 12px;
  border-radius: 999px;
  background: linear-gradient(135deg, #7b2ff7, #ff4fa0);
  color: #fff;
  font-weight: 700;
  font-size: clamp(19px, 4.8vw, 26px);
  box-shadow: 0 7px 0 #4b169e, 0 14px 24px rgba(0,0,0,.18);
  animation: bob 2.4s ease-in-out infinite;
}
.gamebtn .art {
  width: 1.8em; height: 1.8em; border-radius: 50%;
  background: #fff; font-size: 1.1em;
}
.gamebtn:active { transform: translateY(5px); box-shadow: 0 2px 0 #4b169e; }

.score { display: flex; gap: 2px; }
.score i {
  font-style: normal;
  font-size: clamp(30px, 8vw, 42px);
  line-height: 1;
  color: rgba(255,255,255,.55);
  -webkit-text-stroke: .07em rgba(0,0,0,.18);
  paint-order: stroke fill;
  display: inline-block;
}
.score i.on { color: #ffd23f; -webkit-text-stroke-color: #c98a00; text-shadow: 0 0 8px #fff, 0 0 16px #fff; }

.qstage .qmark {
  font-family: inherit;
  font-weight: 700;
  font-size: min(30vw, 22vh, 200px);
  line-height: 1;
  color: #fff;
  -webkit-text-stroke: .12em hsl(var(--h1) 75% 45%);
  paint-order: stroke fill;
  animation: sway 1.6s ease-in-out infinite;
  display: inline-block;
}
.qstage .replay {
  position: absolute; right: 2%; bottom: 2%;
  width: 26%; aspect-ratio: 1; border-radius: 50%;
  background: #fff;
  box-shadow: 0 5px 0 rgba(0,0,0,.15);
  display: grid; place-items: center;
  font-family: var(--emoji);
  font-size: min(8vw, 6vh, 48px);
  z-index: 2;
}
.feedback {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  pointer-events: none;
  z-index: 4;
}
.feedback .fb {
  background: #fff;
  border-radius: 28px;
  padding: .35em .8em .45em;
  text-align: center;
  font-weight: 700;
  font-size: clamp(28px, 8vw, 58px);
  line-height: 1.1;
  box-shadow: 0 8px 0 rgba(0,0,0,.15), 0 18px 40px rgba(0,0,0,.2);
  transform: scale(0);
  max-width: 92vw;
}
.feedback .fb small { display: block; font-size: .55em; color: hsl(var(--h1) 60% 40%); }
.feedback .fb.good { color: #e0197d; }
.feedback .fb.try { color: #6a2fd6; }

.choices {
  display: flex; justify-content: center;
  gap: clamp(8px, 3vw, 28px);
  padding: 6px max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.choices .bubble { flex: 1 1 0; max-width: 180px; transition: opacity .3s, filter .3s; }
.choices .bw { width: min(26vw, 150px, 19vh); }
.choices .art { font-size: min(14vw, 10vh, 84px); }
.choices .bubble:disabled { opacity: .35; filter: grayscale(.8); cursor: default; }

@media (orientation: landscape) and (max-height: 500px) {
  .stage { width: min(40vw, 42vh); margin: 4px 0; }
  .name { font-size: clamp(26px, 8vh, 48px); margin-bottom: 0; }
  .hint { display: none; }
  .pad { height: clamp(52px, 16vh, 80px); }
  .choices .bw { width: min(18vw, 24vh); }
  .choices .bubble .label { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  .logo span.ch, .bubble .bw, .stage .art, .hint, #start button, .gamebtn, .qstage .qmark { animation: none; }
  .bubble .ring, .stage .ring1, .stage .ring2, #start button::before { animation-duration: 60s; }
}
</style>
</head>
<body>
<div id="sun"></div>
<div id="glow"></div>
<canvas id="bg"></canvas>

<main id="home" class="screen">
  <h1 class="logo" aria-label="Soivat Sivut"></h1>
  <p class="tagline">Valitse soitin ja kuuntele! 🎶</p>
  <button class="gamebtn" id="gameBtn"><span class="art">❓</span>Arvauspeli</button>
  <div class="grid" id="grid"></div>
</main>

<section id="book" class="screen" hidden>
  <div class="top">
    <div class="group">
      <button class="iconbtn" data-home aria-label="Kotiin">🏠</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="group">
      <button class="iconbtn speak" aria-label="Puhe päälle tai pois" hidden>🗣️</button>
      <button class="iconbtn mute" aria-label="Ääni päälle tai pois">🔊</button>
    </div>
  </div>
  <div class="middle" id="middle">
    <button class="navbtn" id="prev" aria-label="Edellinen sivu">‹</button>
    <div class="stagewrap" id="stagewrap">
      <h2 class="name" id="name"></h2>
      <button class="stage" id="stage" aria-label="Soita kappale">
        <span class="ring1"></span>
        <span class="ring2"></span>
        <span class="disc"><span class="artwrap" id="artwrap"><span class="art" id="art"></span></span></span>
        <span class="say" id="say"></span>
      </button>
      <div class="hint" id="hint">👆 Paina soitinta!</div>
    </div>
    <button class="navbtn" id="next" aria-label="Seuraava sivu">›</button>
  </div>
  <div class="pads" id="pads"></div>
</section>

<section id="quiz" class="screen" hidden>
  <div class="top">
    <div class="group">
      <button class="iconbtn" data-home aria-label="Kotiin">🏠</button>
    </div>
    <div class="score" id="score" role="img" aria-label="Tähdet"></div>
    <div class="group">
      <button class="iconbtn speak" aria-label="Puhe päälle tai pois" hidden>🗣️</button>
      <button class="iconbtn mute" aria-label="Ääni päälle tai pois">🔊</button>
    </div>
  </div>
  <div class="middle">
    <div class="stagewrap">
      <h2 class="name">Mikä soitin soi?</h2>
      <button class="stage qstage" id="qstage" aria-label="Kuuntele uudestaan">
        <span class="ring1"></span>
        <span class="ring2"></span>
        <span class="disc"><span class="artwrap" id="qartwrap"><span class="art" id="qart"></span></span></span>
        <span class="replay" aria-hidden="true">🔁</span>
      </button>
    </div>
    <div class="feedback"><div class="fb" id="fb"></div></div>
  </div>
  <div class="choices" id="choices"></div>
</section>

<div id="start"><button aria-label="Aloita"><span class="play"></span></button></div>

<canvas id="fx"></canvas>

<script>
'use strict';

/* ════════════════════ Sisältö ════════════════════ */

const FLUTE_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-35 50 50)">
  <rect x="4" y="41" width="92" height="18" rx="9" fill="#d5dde8" stroke="#56627a" stroke-width="3"/>
  <rect x="9" y="44" width="82" height="5" rx="2.5" fill="#fff" opacity=".8"/>
  <ellipse cx="20" cy="50" rx="4.5" ry="3.2" fill="#2f3850"/>
  <circle cx="44" cy="50" r="3.4" fill="#f6c343" stroke="#56627a" stroke-width="1.5"/>
  <circle cx="55" cy="50" r="3.4" fill="#f6c343" stroke="#56627a" stroke-width="1.5"/>
  <circle cx="66" cy="50" r="3.4" fill="#f6c343" stroke="#56627a" stroke-width="1.5"/>
  <circle cx="79" cy="50" r="3.4" fill="#f6c343" stroke="#56627a" stroke-width="1.5"/>
  <rect x="90" y="39" width="7" height="22" rx="3" fill="#b8c2d2" stroke="#56627a" stroke-width="3"/>
</g></svg>`;

const XYLO_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <path d="M6 33 L94 41 M6 69 L94 61" stroke="#8a5528" stroke-width="7" stroke-linecap="round"/>
  ${[0, 1, 2, 3, 4, 5].map(i => {
    const h = 62 - i * 6, x = 9 + i * 14, y = 51 - h / 2;
    return `<rect x="${x}" y="${y}" width="12" height="${h}" rx="4" fill="hsl(${i * 55} 90% 58%)" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
            <circle cx="${x + 6}" cy="${y + 6}" r="1.6" fill="#fff"/><circle cx="${x + 6}" cy="${y + h - 6}" r="1.6" fill="#fff"/>`;
  }).join('')}
  <path d="M62 4 L86 26" stroke="#c98b4a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="4" r="6" fill="#ff4f7b"/>
  <path d="M96 12 L76 30" stroke="#c98b4a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="97" cy="10" r="6" fill="#4f8bff"/>
</svg>`;

// Sävelet MIDI-numeroina (60 = keski-C). [sävel | sointu | null, iskujen määrä]
const INSTRUMENTS = [
  { id: 'piano', name: 'Piano', word: 'Pling plong!', art: '🎹', h1: 205, h2: 50, base: 60, bpm: 170,
    tune: [[60,1],[60,1],[67,1],[67,1],[69,1],[69,1],[67,2],[65,1],[65,1],[64,1],[64,1],[62,1],[62,1],[60,2]] },
  { id: 'drums', name: 'Rummut', word: 'Bum bum tsak!', art: '🥁', h1: 8, h2: 48, bpm: 190,
    pads: ['BUM', 'TSAK', 'TSS', 'TUM', 'PLÄS'],
    tune: [[0,1],[2,1],[1,1],[2,1],[0,1],[0,1],[1,1],[2,1],[3,.5],[3,.5],[3,.5],[3,.5],[1,.5],[1,.5],[1,.5],[1,.5],[[0,4],3]] },
  { id: 'trumpet', name: 'Trumpetti', word: 'Töö-töö-töö!', art: '🎺', h1: 45, h2: 190, base: 60, bpm: 150,
    tune: [[67,.5],[72,.5],[76,.5],[79,1.5],[76,.5],[79,3]] },
  { id: 'guitar', name: 'Kitara', word: 'Tsing tsang!', art: '🎸', h1: 280, h2: 55, base: 48, bpm: 140,

const PENTA = [0, 2, 4, 7, 9, 12];
const SOLFA = ['do', 're', 'mi', 'so', 'la', 'do'];
const PAD_HUES = [0, 28, 50, 130, 200, 280];

/* ════════════════════ Ääni (Web Audio, kaikki syntetisoitu) ════════════════════ */

let ctx = null, master = null, noiseBuf = null;
let muted = false;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function audio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.ratio.value = 4;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = muted ? 0 : .8;
    master.connect(comp);
    const verb = ctx.createConvolver();
    verb.buffer = impulse(2.2);
    const wet = ctx.createGain();
    wet.gain.value = .22;
    master.connect(verb);
    verb.connect(wet);
    wet.connect(comp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}

function impulse(sec) {
  const len = Math.floor(ctx.sampleRate * sec);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return buf;
}

// Äänenvoimakkuuskäyrä: nousu → vaimeneminen tasolle sus → (valinnainen) päästö
function env(dest, t, a, peak, sus, decay, releaseAt, release) {
  const g = ctx.createGain();
  const p = g.gain;
  p.setValueAtTime(0, t);
  p.linearRampToValueAtTime(peak, t + a);
  p.setTargetAtTime(sus, t + a, decay);
  if (releaseAt != null) p.setTargetAtTime(0, Math.max(releaseAt, t + a), release);
  g.connect(dest);
  return g;
}

function osc(type, f, t, end, dest, amp = 1, detune = 0) {
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  o.detune.value = detune;
  if (amp !== 1) {
    const g = ctx.createGain();
    g.gain.value = amp;
    o.connect(g);
    g.connect(dest);
  } else {
    o.connect(dest);
  }
  o.start(t);
  o.stop(end);
  return o;
}

function filt(type, f, q, dest) {
  const b = ctx.createBiquadFilter();
  b.type = type;
  b.frequency.value = f;
  if (q != null) b.Q.value = q;
  b.connect(dest);
  return b;
}

function noise(t, end, dest) {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  s.connect(dest);
  s.start(t, Math.random() * 1.5);
  s.stop(end);
  return s;
}

function vibrato(oscs, t, end, rate, cents, delay) {
  const l = ctx.createOscillator();
  l.frequency.value = rate;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0, t + delay);
  g.gain.linearRampToValueAtTime(cents, t + delay + .25);
  l.connect(g);
  oscs.forEach(o => g.connect(o.detune));
  l.start(t);
  l.stop(end);
}

// Karplus–Strong -kielimalli kitaralle; puskurit välimuistiin sävelittäin
const ksCache = new Map();
function pluckBuffer(m) {
  if (ksCache.has(m)) return ksCache.get(m);
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * 2);
  const buf = ctx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  const N = Math.max(2, Math.round(sr / mtof(m)));
  const ring = new Float32Array(N);
  let last = 0;
  for (let i = 0; i < N; i++) { last = last * .5 + (Math.random() * 2 - 1) * .5; ring[i] = last; }
  let idx = 0;
  for (let i = 0; i < len; i++) {
    const cur = ring[idx], nxt = ring[(idx + 1) % N];
    ring[idx] = (cur + nxt) * .5 * .996;
    d[i] = cur;
    idx = (idx + 1) % N;
  }
  ksCache.set(m, buf);
  return buf;
}

const VOICES = {
  piano(m, t, dur, out, v = 1) {
    const f = mtof(m), end = t + Math.max(dur, .3) + 1.2;
    const g = env(out, t, .004, .5 * v, 0, .55, t + Math.max(dur, .3) + .3, .12);
    const lp = filt('lowpass', f * 7, .7, g);
    lp.frequency.setTargetAtTime(f * 2.5, t, .25);
    osc('triangle', f, t, end, lp);
    osc('sine', f * 2, t, end, lp, .35, 4);
    osc('sine', f * 3, t, end, lp, .1);
  },

  xylo(m, t, dur, out, v = 1) {
    const f = mtof(m);
    osc('sine', f, t, t + 1.3, env(out, t, .002, .6 * v, 0, .2));
    osc('sine', f * 4, t, t + .4, env(out, t, .001, .18 * v, 0, .04));
    noise(t, t + .05, filt('bandpass', f * 2, 2, env(out, t, .001, .25 * v, 0, .01)));
  },

  bells(m, t, dur, out, v = 1) {
    const f = mtof(m);
    [[1, 1, 1.1], [2.76, .45, .45], [5.4, .25, .22], [8.93, .12, .1]].forEach(([r, a, tau]) => {
      osc('sine', f * r, t, t + tau * 7, env(out, t, .002, .28 * a * v, 0, tau));
    });
  },

  guitar(m, t, dur, out, v = 1) {
    const s = ctx.createBufferSource();
    s.buffer = pluckBuffer(m);
    const g = env(out, t, .002, .9 * v, .9 * v, 1, t + Math.max(dur, 1.4), .15);
    s.connect(filt('lowpass', 3500, .5, g));
    s.start(t);
  },

  trumpet(m, t, dur, out, v = 1) {
    const f = mtof(m), end = t + dur + .4;
    const g = env(out, t, .03, .32 * v, .26 * v, .1, t + dur, .06);
    const lp = filt('lowpass', f * 1.2, 1.5, g);
    lp.frequency.setValueAtTime(f * 1.2, t);
    lp.frequency.linearRampToValueAtTime(Math.min(f * 7, 9000), t + .06);
    lp.frequency.setTargetAtTime(f * 4, t + .06, .12);
    const o = osc('sawtooth', f, t, end, lp);
    o.detune.setValueAtTime(-60, t);
    o.detune.linearRampToValueAtTime(0, t + .05);
    vibrato([o], t, end, 5.5, 14, .2);
  },

  violin(m, t, dur, out, v = 1) {
    const f = mtof(m), end = t + dur + .5;
    const g = env(out, t, .1, .38 * v, .32 * v, .2, t + dur, .1);
    const lp = filt('lowpass', 4200, .6, g);
    const o1 = osc('sawtooth', f, t, end, lp, .6, -5);
    const o2 = osc('sawtooth', f, t, end, lp, .6, 5);
    vibrato([o1, o2], t, end, 6, 22, .1);
  },

  flute(m, t, dur, out, v = 1) {
    const f = mtof(m), end = t + dur + .4;
    const g = env(out, t, .06, .38 * v, .3 * v, .15, t + dur, .08);
    const o1 = osc('sine', f, t, end, g);
    const o2 = osc('triangle', f * 2, t, end, g, .07);
    vibrato([o1, o2], t, end, 5, 16, .15);
    noise(t, end, filt('bandpass', f, 5, env(out, t, .03, .14 * v, .04 * v, .08, t + dur, .05)));
  },

  sax(m, t, dur, out, v = 1) {
    const f = mtof(m), end = t + dur + .4;
    const g = env(out, t, .04, .3 * v, .24 * v, .15, t + dur, .08);
    const lp = filt('lowpass', f * 2, 3, g);
    lp.frequency.setValueAtTime(f * 2, t);
    lp.frequency.linearRampToValueAtTime(Math.min(f * 5, 8000), t + .08);
    const o1 = osc('sawtooth', f, t, end, lp, .7);
    const o2 = osc('square', f, t, end, lp, .3, 6);
    o1.detune.setValueAtTime(-40, t);
    o1.detune.linearRampToValueAtTime(0, t + .06);
    vibrato([o1, o2], t, end, 5, 20, .15);
    noise(t, end, filt('highpass', 2500, .7, env(out, t, .02, .04 * v, .015 * v, .1, t + dur, .05)));
  },

  accordion(m, t, dur, out, v = 1) {
    const f = mtof(m), end = t + dur + .4;
    const g = env(out, t, .04, .34 * v, .29 * v, .1, t + dur, .06);
    const lp = filt('lowpass', 2400, .7, g);
    [-9, 0, 9].forEach(dt => osc('sawtooth', f, t, end, lp, .45, dt));
  },

  // Rummuissa "sävel" on lyömäsoittimen numero 0–4
  drums(n, t, dur, out, v = 1) {
    if (n === 0) {            // BUM – bassorumpu
      const o = osc('sine', 160, t, t + .7, env(out, t, .002, 1 * v, 0, .14));
      o.frequency.exponentialRampToValueAtTime(42, t + .16);
      noise(t, t + .02, filt('highpass', 3000, .7, env(out, t, .001, .15 * v, 0, .004)));
    } else if (n === 1) {     // TSAK – virveli
      noise(t, t + .4, filt('highpass', 1200, .7, env(out, t, .001, .5 * v, 0, .06)));
      const o = osc('triangle', 200, t, t + .3, env(out, t, .001, .4 * v, 0, .05));
      o.frequency.exponentialRampToValueAtTime(140, t + .1);
    } else if (n === 2) {     // TSS – hi-hat
      noise(t, t + .2, filt('highpass', 7500, 1, env(out, t, .001, .3 * v, 0, .025)));
    } else if (n === 3) {     // TUM – tomi
      const o = osc('sine', 230, t, t + .8, env(out, t, .002, .8 * v, 0, .14));
      o.frequency.exponentialRampToValueAtTime(110, t + .3);
    } else {                  // PLÄS – symbaali
      noise(t, t + 2.6, filt('highpass', 5000, .5, env(out, t, .001, .35 * v, 0, .55)));
      noise(t, t + 1, filt('bandpass', 3200, 1, env(out, t, .001, .2 * v, 0, .2)));
    }
  },
};

let tune = null;

function stopTune() {
  if (!tune) return;
  tune.timers.forEach(clearTimeout);
  const bus = tune.bus, now = ctx.currentTime;
  bus.gain.cancelScheduledValues(now);
  bus.gain.setValueAtTime(bus.gain.value, now);
  bus.gain.linearRampToValueAtTime(0, now + .08);
  setTimeout(() => bus.disconnect(), 300);
  tune = null;
}

function playTune(ins) {
  if (!audio()) return;
  stopTune();
  const bus = ctx.createGain();
  bus.connect(master);
  const beat = 60 / ins.bpm;
  const timers = [];
  let t = ctx.currentTime + .06;
  ins.tune.forEach(([n, b]) => {
    const notes = n == null ? [] : Array.isArray(n) ? n : [n];
    const strum = ins.id === 'guitar' ? .035 : 0;
    notes.forEach((x, k) => VOICES[ins.id](x, t + k * strum, b * beat * .92, bus, 1 / Math.sqrt(notes.length)));
    if (notes.length) {
      timers.push(setTimeout(() => onNote(ins, notes, true), Math.max(0, (t - ctx.currentTime) * 1000)));
    }
    t += b * beat;
  });
  const me = { bus, timers };
  timers.push(setTimeout(() => { if (tune === me) tune = null; }, (t - ctx.currentTime) * 1000 + 1500));
  tune = me;
}

function playPad(j) {
  const ins = INSTRUMENTS[page];
  if (!ins || !audio()) return;
  const note = ins.drum ? j : ins.base + PENTA[j];
  VOICES[ins.id](note, ctx.currentTime + .005, .5, master, 1);
  onNote(ins, [note], false, j);
}

function setMuted(m) {
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : .8, ctx.currentTime, .03);
  muteBtns.forEach(b => {
    b.textContent = m ? '🔇' : '🔊';
    b.classList.toggle('off', m);
  });
}

/* ─── Palauteäänet arvauspeliin ─── */

// Käsientaputus: kolme nopeaa kohinapurskahdusta ja lyhyt kaiku
function clap(t, v = 1, f = 1100) {
  [0, .011, .022].forEach((d, i) => {
    noise(t + d, t + d + .2, filt('bandpass', f, 1.2, env(master, t + d, .001, .45 * v, 0, i < 2 ? .008 : .06)));
  });
}

function applause(t, dur, density) {
  for (let i = 0; i < dur * density; i++) clap(t + Math.random() * dur, rand(.15, .45), rand(800, 1600));
}

// Iloinen "Jee!" -huudahdus: sahalaine nousevalla sävelkorkeudella ja ii-vokaalin formantit
function yay(t, f0, v = 1) {
  const end = t + 1;
  const g = env(master, t, .05, .5 * v, .4 * v, .3, t + .6, .1);
  const o = ctx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(f0 * .75, t);
  o.frequency.linearRampToValueAtTime(f0 * 1.25, t + .25);
  o.frequency.linearRampToValueAtTime(f0 * 1.1, t + .8);
  [[280, 6, 1], [2300, 10, .5], [3100, 12, .3]].forEach(([f, q, a]) => {
    const ag = ctx.createGain();
    ag.gain.value = a;
    ag.connect(g);
    o.connect(filt('bandpass', f, q, ag));
  });
  vibrato([o], t, end, 7, 30, .2);
  o.start(t);
  o.stop(end);
}

function playCheer() {
  if (!audio()) return;
  const t = ctx.currentTime + .02;
  [[60, 0], [64, .1], [67, .2]].forEach(([m, d]) => VOICES.trumpet(m, t + d, .09, master, .8));
  VOICES.trumpet(72, t + .3, .6, master, .9);
  yay(t + .35, 520);
  yay(t + .4, 700, .8);
  applause(t + .3, 1.8, 26);
  [84, 88, 91, 96, 100].forEach((m, i) => VOICES.bells(m, t + .45 + i * .07, .2, master, .5));
}

function playEncourage() {
  if (!audio()) return;
  const t = ctx.currentTime + .02;
  // Pehmeä "hups" ilman pettymyksen tuntua
  const o = osc('sine', 520, t, t + .5, env(master, t, .01, .35, 0, .12));
  o.frequency.exponentialRampToValueAtTime(260, t + .3);
  // Kannustavat taputukset ja nouseva "sinä pystyt siihen" -melodia
  clap(t + .35, .8);
  clap(t + .6, .8);
  [[67, .35], [69, .6], [72, .85], [76, 1.05]].forEach(([m, d]) => VOICES.xylo(m, t + d, .2, master, .8));
}

function playParty() {
  if (!audio()) return;
  const t = ctx.currentTime + .02;
  [[67, 0, .1], [72, .15, .1], [76, .3, .1], [79, .45, .4], [76, .9, .12], [79, 1.05, .9]]
    .forEach(([m, d, l]) => { VOICES.trumpet(m, t + d, l, master, .9); VOICES.trumpet(m - 12, t + d, l, master, .5); });
  yay(t + 1, 560);
  yay(t + 1.05, 740, .8);
  applause(t + .9, 3, 30);
  VOICES.drums(4, t + 1.05, 1, master, 1);
}

let fiVoice = null, speakOn = true;
const canSpeak = 'speechSynthesis' in window;

function loadVoices() {
  if (!canSpeak) return;
  fiVoice = speechSynthesis.getVoices().find(v => /^fi/i.test(v.lang)) || null;
  speakBtns.forEach(b => { b.hidden = !fiVoice; });
}

function say(text) {
  if (!canSpeak || !fiVoice || !speakOn) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = fiVoice;
  u.lang = fiVoice.lang;
  u.rate = .9;
  u.pitch = 1.3;
  speechSynthesis.speak(u);
}

/* ════════════════════ Visuaalit: pyörivä tausta, leijuvat muodot, kipinät ════════════════════ */

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const sun = $('#sun'), bg = $('#bg'), fx = $('#fx');
const bctx = bg.getContext('2d'), fctx = fx.getContext('2d');
let W = 0, H = 0;
let sunAngle = 0, sunBoost = 0;
let hue1 = 330, hue2 = 50;
const floaters = [], particles = [], waves = [];
const SHAPES = ['note', 'note2', 'star', 'circle', 'ring', 'heart'];

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const [c, x] of [[bg, bctx], [fx, fctx]]) {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
    c.style.width = W + 'px';
    c.style.height = H + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function makeFloater(anywhere) {
  return {
    x: rand(0, W), y: anywhere ? rand(0, H) : H + 40,
    s: rand(10, 28), rot: rand(0, 6.28), vr: rand(-1.2, 1.2),
    vy: rand(-45, -15), sway: rand(0, 6.28), shape: pick(SHAPES),
    white: Math.random() < .55, a: rand(.35, .7),
  };
}

function drawShape(c, shape, s) {
  switch (shape) {
    case 'circle': c.beginPath(); c.arc(0, 0, s * .6, 0, 6.2832); c.fill(); break;
    case 'ring': c.lineWidth = s * .22; c.beginPath(); c.arc(0, 0, s * .55, 0, 6.2832); c.stroke(); break;
    case 'star': {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? s * .32 : s * .75, a = i * Math.PI / 5 - Math.PI / 2;
        c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      c.closePath(); c.fill(); break;
    }
    case 'heart': {
      const k = s * .045;
      c.beginPath();
      c.moveTo(0, 6 * k);
      c.bezierCurveTo(-14 * k, -4 * k, -6 * k, -14 * k, 0, -6 * k);
      c.bezierCurveTo(6 * k, -14 * k, 14 * k, -4 * k, 0, 6 * k);
      c.fill(); break;
    }
    default:
      c.font = `700 ${s * 1.6}px sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(shape === 'note' ? '♪' : '♫', 0, 0);
  }
}

const MAX_PARTICLES = 700;

function burst(x, y, hue, n = 16, power = 1, shapes = SHAPES) {
  if (reduceMotion) n = Math.ceil(n / 3);
  for (let i = 0; i < n && particles.length < MAX_PARTICLES; i++) {
    const a = rand(0, 6.2832), sp = rand(180, 520) * power;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120 * power,
      rot: rand(0, 6.28), vr: rand(-8, 8), s: rand(12, 28),
      shape: pick(shapes), color: `hsl(${hue + rand(-35, 35)} 95% ${rand(52, 68)}%)`,
      life: 0, max: rand(.8, 1.5),
    });
  }
  waves.push({ x, y, r: 10, life: 0, max: .7, color: `hsl(${hue} 95% 60%)` });
}

// Kultainen tähtisade ylhäältä
function starRain(n) {
  if (reduceMotion) n = Math.ceil(n / 4);
  for (let i = 0; i < n && particles.length < MAX_PARTICLES; i++) {
    particles.push({
      x: rand(0, W), y: rand(-120, -10), vx: rand(-60, 60), vy: rand(0, 220),
      rot: rand(0, 6.28), vr: rand(-5, 5), s: rand(16, 36),
      shape: 'star', color: `hsl(${rand(38, 55)} 100% ${rand(55, 70)}%)`,
      life: 0, max: rand(2.4, 3.4),
    });
  }
}

// Ilotulitus: purskeita satunnaisiin kohtiin ruudun yläosassa
function fireworks(count, spread) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => burst(rand(W * .1, W * .9), rand(H * .1, H * .5), rand(0, 360), 26, 1.2),
      i * spread + rand(0, 120));
  }
}

function center(el) {
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}

function onNote(ins, notes, fromTune, padIndex) {
  const n = notes[0];
  const hue = ins.drum ? PAD_HUES[n] : ((n % 12) * 30 + 10);
  const inQuiz = mode === 'quiz';
  if (fromTune) {
    const [x, y] = center(inQuiz ? qStage : stageEl);
    burst(x, y, hue, 14 + notes.length * 3, 1);
    // Sytytä vastaava värinappi, jos kappaleen sävel löytyy napeista
    const j = ins.drum ? n : PENTA.findIndex(p => ins.base + p === n);
    if (j >= 0 && !inQuiz) flashPad(j);
  } else {
    flashPad(padIndex);
    const pad = padsEl.children[padIndex];
    if (pad) { const [x, y] = center(pad); burst(x, y - 20, PAD_HUES[padIndex], 12, .9); }
  }
  bounceArt(fromTune ? 1 : .6, inQuiz ? qArtWrap : artWrap);
  sunBoost += fromTune ? 70 : 45;
}

function bounceArt(k, el = artWrap) {
  if (reduceMotion) return;
  el.animate([
    { transform: 'scale(1) rotate(0)' },
    { transform: `scale(${1 + .22 * k}, ${1 - .12 * k}) rotate(${rand(-12, 12) * k}deg)` },
    { transform: `scale(${1 - .06 * k}, ${1 + .12 * k})` },
    { transform: 'scale(1) rotate(0)' },
  ], { duration: 380, easing: 'ease-out' });
}

function flashPad(j) {
  const pad = padsEl.children[j];
  if (!pad) return;
  pad.animate([
    { transform: 'translateY(6px) scale(.96)', filter: 'brightness(1.35)', boxShadow: '0 1px 0 rgba(0,0,0,.2)' },
    { transform: 'none', filter: 'none' },
  ], { duration: 260, easing: 'ease-out' });
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;

  // Aurinkosäteet pyörivät koko ajan, ja jokainen sävel antaa vauhtia
  sunAngle = (sunAngle + ((reduceMotion ? 1.5 : 9) + sunBoost) * dt) % 360;
  sunBoost *= Math.exp(-dt * 2.2);
  sun.style.transform = `rotate(${sunAngle}deg)`;

  // Leijuvat taustamuodot
  bctx.clearRect(0, 0, W, H);
  for (const f of floaters) {
    f.y += f.vy * dt * (1 + sunBoost / 60);
    f.rot += f.vr * dt;
    f.sway += dt;
    if (f.y < -50) Object.assign(f, makeFloater(false));
    bctx.save();
    bctx.globalAlpha = f.a;
    bctx.translate(f.x + Math.sin(f.sway) * 18, f.y);
    bctx.rotate(f.rot);
    bctx.fillStyle = bctx.strokeStyle = f.white ? '#fff' : `hsl(${hue2} 95% 62%)`;
    drawShape(bctx, f.shape, f.s);
    bctx.restore();
  }

  // Kipinät ja aallot
  fctx.clearRect(0, 0, W, H);
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.life += dt;
    if (w.life > w.max) { waves.splice(i, 1); continue; }
    const k = w.life / w.max;
    fctx.globalAlpha = (1 - k) * .8;
    fctx.strokeStyle = w.color;
    fctx.lineWidth = 10 * (1 - k) + 2;
    fctx.beginPath();
    fctx.arc(w.x, w.y, 20 + k * Math.min(W, H) * .35, 0, 6.2832);
    fctx.stroke();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    p.vy += 420 * dt;
    p.vx *= Math.exp(-dt * 1.2);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    const k = p.life / p.max;
    fctx.save();
    fctx.globalAlpha = 1 - k * k;
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    const pop = Math.min(1, p.life * 10);
    fctx.scale(pop, pop);
    fctx.fillStyle = fctx.strokeStyle = p.color;
    drawShape(fctx, p.shape, p.s);
    fctx.restore();
  }
  fctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

/* ════════════════════ Näkymät ja ohjaus ════════════════════ */

const home = $('#home'), book = $('#book'), grid = $('#grid');
const nameEl = $('#name'), artEl = $('#art'), artWrap = $('#artwrap'), stageEl = $('#stage');
const stageWrap = $('#stagewrap'), sayEl = $('#say'), hintEl = $('#hint');
const padsEl = $('#pads'), dotsEl = $('#dots');
const quizEl = $('#quiz'), qStage = $('#qstage'), qArt = $('#qart'), qArtWrap = $('#qartwrap');
const choicesEl = $('#choices'), scoreEl = $('#score'), fbEl = $('#fb'), startEl = $('#start');
const muteBtns = document.querySelectorAll('.mute'), speakBtns = document.querySelectorAll('.speak');
const themeMeta = document.querySelector('meta[name=theme-color]');
let page = -1, mode = 'home';

function show(screen) {
  if (ctx) stopTune();
  clearQuizTimers();
  for (const s of [home, book, quizEl]) s.hidden = s !== screen;
  mode = screen === book ? 'book' : screen === quizEl ? 'quiz' : 'home';
}

INSTRUMENTS.forEach(ins => { ins.drum = ins.id === 'drums'; });

function setHues(h1, h2) {
  hue1 = h1; hue2 = h2;
  document.documentElement.style.setProperty('--h1', h1);
  document.documentElement.style.setProperty('--h2', h2);
  themeMeta.content = `hsl(${h1} 90% 72%)`;
}

function buildHome() {
  const logo = $('.logo');
  let i = 0;
  logo.innerHTML = 'Soivat Sivut'.split(' ').map(w =>
    `<span class="word" aria-hidden="true">${[...w].map(ch => `<span class="ch" style="--i:${i++}">${ch}</span>`).join('')}</span>`
  ).join('');
  grid.innerHTML = INSTRUMENTS.map((ins, k) => `
    <button class="bubble" data-k="${k}" style="--h:${ins.h1};--d:${(-k * .37).toFixed(2)}s" aria-label="${ins.name}">
      <span class="bw"><span class="ring"></span><span class="disc"><span class="art">${ins.art}</span></span></span>
      <span class="label">${ins.name}</span>
    </button>`).join('');
  dotsEl.innerHTML = INSTRUMENTS.map(() => '<i></i>').join('');
}

function showHome() {
  show(home);
  page = -1;
  setHues(330, 50);
  history.replaceState(null, '', location.pathname + location.search);
}

function openPage(i, dir = 0) {
  show(book);
  page = (i + INSTRUMENTS.length) % INSTRUMENTS.length;
  const ins = INSTRUMENTS[page];
  setHues(ins.h1, ins.h2);
  nameEl.textContent = ins.name;
  artEl.innerHTML = ins.art;
  sayEl.textContent = ins.word;
  sayEl.style.transform = 'scale(0)';
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === page));

  const labels = ins.drum ? ins.pads : SOLFA;
  padsEl.innerHTML = labels.map((l, j) =>
    `<button class="pad" data-j="${j}" style="--c:${PAD_HUES[j]}" aria-label="${l}">${l}</button>`).join('');

  if (!reduceMotion) {
    stageWrap.animate(dir ? [
      { transform: `translateX(${dir * 70}vw) rotate(${dir * 120}deg) scale(.3)`, opacity: 0 },
      { transform: 'none', opacity: 1 },
    ] : [
      { transform: 'scale(.2) rotate(-200deg)', opacity: 0 },
      { transform: 'none', opacity: 1 },
    ], { duration: 600, easing: 'cubic-bezier(.2,1.25,.4,1)' });
  }
  sunBoost += 160;
  history.replaceState(null, '', '#' + ins.id);
  say(ins.name);
}

function popWord() {
  sayEl.animate([
    { transform: 'scale(0) rotate(-20deg)' },
    { transform: 'scale(1.15) rotate(6deg)', offset: .35 },
    { transform: 'scale(1) rotate(-3deg)', offset: .6 },
    { transform: 'scale(1) rotate(-3deg)', offset: .9 },
    { transform: 'scale(0) rotate(10deg)' },
  ], { duration: 2400, easing: 'ease-out' });
}

function playPage() {
  const ins = INSTRUMENTS[page];
  if (!ins) return;
  playTune(ins);
  popWord();
  hintEl.classList.add('gone');
}

/* ─── Arvauspeli: "Mikä soitin soi?" ─── */

const STARS_PER_TROPHY = 5;
const TRY_AGAIN = ['Melkein!', 'Hyvä yritys!', 'Ei haittaa!', 'Hienosti yritetty!'];
const quiz = { target: null, last: null, choices: [], stars: 0, locked: true, round: 0, timers: [] };

function clearQuizTimers() {
  quiz.timers.forEach(clearTimeout);
  quiz.timers = [];
}

function later(ms, fn) {
  quiz.timers.push(setTimeout(fn, ms));
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderScore(popIndex) {
  scoreEl.innerHTML = Array.from({ length: STARS_PER_TROPHY }, (_, i) =>
    `<i class="${i < quiz.stars ? 'on' : ''}">★</i>`).join('');
  scoreEl.setAttribute('aria-label', `Tähdet: ${quiz.stars} / ${STARS_PER_TROPHY}`);
  const star = scoreEl.children[popIndex];
  if (star && !reduceMotion) {
    star.animate([
      { transform: 'scale(0) rotate(-180deg)' },
      { transform: 'scale(1.8) rotate(20deg)', offset: .6 },
      { transform: 'scale(1) rotate(0)' },
    ], { duration: 700, easing: 'ease-out' });
  }
}

function showFeedback(cls, big, small, ms = 2200) {
  fbEl.className = 'fb ' + cls;
  fbEl.innerHTML = small ? `<small>${small}</small>${big}` : big;
  fbEl.animate([
    { transform: 'scale(0) rotate(-12deg)' },
    { transform: 'scale(1.12) rotate(4deg)', offset: .15 },
    { transform: 'scale(1) rotate(-2deg)', offset: .25 },
    { transform: 'scale(1) rotate(-2deg)', offset: .88 },
    { transform: 'scale(0) rotate(8deg)' },
  ], { duration: ms, easing: 'ease-out' });
}

function startQuiz() {
  show(quizEl);
  history.replaceState(null, '', '#peli');
  quiz.stars = 0;
  quiz.last = null;
  renderScore();
  newRound();
}

function newRound() {
  clearQuizTimers();
  quiz.round++;
  quiz.locked = false;
  // Uusi arvoitus, ei kuitenkaan sama soitin kahdesti peräkkäin
  const pool = INSTRUMENTS.filter(i => i !== quiz.last);
  quiz.target = pick(pool);
  quiz.last = quiz.target;
  const others = shuffle(INSTRUMENTS.filter(i => i !== quiz.target)).slice(0, 2);
  quiz.choices = shuffle([quiz.target, ...others]);
  setHues(270, 50);

  qArt.innerHTML = '<span class="qmark">?</span>';
  choicesEl.innerHTML = quiz.choices.map((ins, k) => `
    <button class="bubble" data-c="${k}" style="--h:${ins.h1};--d:${(-k * .5).toFixed(2)}s" aria-label="${ins.name}">
      <span class="bw"><span class="ring"></span><span class="disc"><span class="art">${ins.art}</span></span></span>
      <span class="label">${ins.name}</span>
    </button>`).join('');
  if (!reduceMotion) {
    [...choicesEl.children].forEach((b, k) => b.animate([
      { transform: 'translateY(120%) scale(.4)', opacity: 0 },
      { transform: 'none', opacity: 1 },
    ], { duration: 500, delay: k * 120, easing: 'cubic-bezier(.2,1.3,.4,1)', fill: 'backwards' }));
  }
  // Kun peli on vasta avattu linkistä, ääni alkaa vasta aloitusnapin jälkeen
  if (startEl.hidden) later(700, replayTarget);
}

function replayTarget() {
  if (mode !== 'quiz' || !quiz.target) return;
  playTune(quiz.target);
}

function choose(k) {
  const ins = quiz.choices[k];
  const btn = choicesEl.children[k];
  if (quiz.locked || !ins || !btn || btn.disabled) return;
  audio();
  if (ctx) stopTune();
  clearQuizTimers();
  if (ins === quiz.target) correct(ins, btn);
  else wrong(ins, btn);
}

function correct(ins, btn) {
  quiz.locked = true;
  quiz.stars++;
  playCheer();
  setHues(ins.h1, ins.h2);
  say(`Hurraa! Oikein! ${ins.name}!`);
  showFeedback('good', 'Hurraa! 🎉', `Oikein, ${ins.name}!`, 2600);

  // Kysymysmerkin tilalle paljastuu oikea soitin
  qArt.innerHTML = ins.art;
  if (!reduceMotion) {
    qArtWrap.animate([
      { transform: 'scale(0) rotate(-540deg)' },
      { transform: 'scale(1.2) rotate(20deg)', offset: .7 },
      { transform: 'none' },
    ], { duration: 800, easing: 'ease-out' });
    btn.animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.25) rotate(-6deg)' },
      { transform: 'scale(1.15) rotate(6deg)' }, { transform: 'scale(1)' },
    ], { duration: 900, easing: 'ease-in-out' });
  }
  [...choicesEl.children].forEach(b => { if (b !== btn) b.disabled = true; });

  const [x, y] = center(btn.querySelector('.bw'));
  burst(x, y, ins.h1, 36, 1.4, ['star', 'star', 'heart', 'note']);
  const [sx, sy] = center(qStage);
  burst(sx, sy, 50, 30, 1.3, ['star']);
  starRain(90);
  fireworks(4, 280);
  sunBoost += 500;
  renderScore(quiz.stars - 1);

  if (quiz.stars >= STARS_PER_TROPHY) {
    later(2300, trophy);
  } else {
    later(3200, newRound);
  }
}

// Viisi tähteä täynnä: iso juhla ja uusi kierros alusta
function trophy() {
  playParty();
  say('Mahtavaa! Sait viisi tähteä!');
  showFeedback('good', 'Mahtavaa! 🏆', 'Viisi tähteä!', 3800);
  qArt.innerHTML = '🏆';
  starRain(160);
  fireworks(12, 250);
  sunBoost += 900;
  later(4200, () => {
    quiz.stars = 0;
    renderScore();
    newRound();
  });
}

function wrong(ins, btn) {
  const round = quiz.round;
  playEncourage();
  const cheer = pick(TRY_AGAIN);
  say(`${cheer} Kokeile vielä kerran!`);
  showFeedback('try', 'Kokeile vielä kerran! 💪', cheer, 2000);
  btn.disabled = true;
  if (!reduceMotion) {
    btn.animate([
      { transform: 'translateX(0)' }, { transform: 'translateX(-14px) rotate(-6deg)' },
      { transform: 'translateX(12px) rotate(5deg)' }, { transform: 'translateX(-8px) rotate(-3deg)' },
      { transform: 'translateX(0)' },
    ], { duration: 450, easing: 'ease-in-out' });
  }
  const [x, y] = center(btn.querySelector('.bw'));
  burst(x, y, 330, 10, .7, ['heart']);
  // Soitetaan arvoitus uudestaan, jotta lapsi saa kuunnella taas
  later(2100, () => { if (quiz.round === round && !quiz.locked) replayTarget(); });
}

/* ─── Tapahtumat ─── */

grid.addEventListener('click', e => {
  const b = e.target.closest('.bubble');
  if (!b) return;
  audio();
  const [x, y] = center(b.querySelector('.bw'));
  burst(x, y, INSTRUMENTS[+b.dataset.k].h1, 20, 1.1);
  openPage(+b.dataset.k);
});

document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', showHome));
$('#prev').addEventListener('click', () => { audio(); openPage(page - 1, -1); });
$('#next').addEventListener('click', () => { audio(); openPage(page + 1, 1); });
muteBtns.forEach(b => b.addEventListener('click', () => setMuted(!muted)));
speakBtns.forEach(b => b.addEventListener('click', () => {
  speakOn = !speakOn;
  speakBtns.forEach(s => s.classList.toggle('off', !speakOn));
  if (!speakOn) speechSynthesis.cancel();
}));

$('#gameBtn').addEventListener('click', () => {
  audio();
  const [x, y] = center($('#gameBtn'));
  burst(x, y, 300, 24, 1.1);
  startQuiz();
});
choicesEl.addEventListener('click', e => {
  const b = e.target.closest('.bubble');
  if (b) choose(+b.dataset.c);
});
qStage.addEventListener('click', () => {
  if (quiz.locked) return;
  audio();
  clearQuizTimers();
  replayTarget();
});

// Pyyhkäisy vaihtaa sivua; napautus soittimeen soittaa kappaleen
let swipe = null, swiped = false;
$('#middle').addEventListener('pointerdown', e => {
  if (e.target.closest('.navbtn')) return;
  swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
window.addEventListener('pointerup', e => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    swiped = true;
    setTimeout(() => { swiped = false; }, 0);
    audio();
    openPage(page + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  }
});
window.addEventListener('pointercancel', () => { swipe = null; });
stageEl.addEventListener('click', () => { if (!swiped) playPage(); });

// Värinapit: soivat heti kosketuksesta, moni sormi yhtä aikaa, ja sormella voi liukua napilta toiselle
const downs = new Set();
padsEl.addEventListener('pointerdown', e => {
  const pad = e.target.closest('.pad');
  if (!pad) return;
  e.preventDefault();
  downs.add(e.pointerId);
  if (pad.hasPointerCapture && pad.hasPointerCapture(e.pointerId)) pad.releasePointerCapture(e.pointerId);
  playPad(+pad.dataset.j);
});
padsEl.addEventListener('pointerover', e => {
  const pad = e.target.closest('.pad');
  if (pad && downs.has(e.pointerId)) playPad(+pad.dataset.j);
});
['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, e => downs.delete(e.pointerId)));
padsEl.addEventListener('click', e => {
  const pad = e.target.closest('.pad');
  if (pad && e.detail === 0) playPad(+pad.dataset.j);   // näppäimistöllä painettu
});

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (mode === 'quiz') {
    if (/^[1-3]$/.test(e.key)) choose(+e.key - 1);
    else if (e.key === 'Escape') showHome();
    else if (e.key === ' ' && document.activeElement === document.body && !quiz.locked) {
      e.preventDefault();
      audio();
      replayTarget();
    }
    return;
  }
  if (mode !== 'book') return;
  if (e.key === 'ArrowRight') openPage(page + 1, 1);
  else if (e.key === 'ArrowLeft') openPage(page - 1, -1);
  else if (e.key === 'Escape') showHome();
  else if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); playPage(); }
  else if (/^[1-6]$/.test(e.key)) playPad(+e.key - 1);
  else return;
  audio();
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && ctx) { stopTune(); ctx.suspend(); }
});

// Aloitusnappi: selaimet sallivat äänen vasta ensimmäisen kosketuksen jälkeen
$('#start').addEventListener('click', e => {
  audio();
  const [x, y] = center($('#start button'));
  burst(x, y, 40, 30, 1.3);
  startEl.hidden = true;
  if (mode === 'book') say(INSTRUMENTS[page].name);
  if (mode === 'quiz') later(400, replayTarget);
});

/* ─── Käynnistys ─── */

resize();
window.addEventListener('resize', resize);
for (let i = 0; i < (reduceMotion ? 8 : 24); i++) floaters.push(makeFloater(true));
buildHome();
if (canSpeak) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }

const fromHash = INSTRUMENTS.findIndex(ins => '#' + ins.id === location.hash);
if (location.hash === '#peli') startQuiz();
else if (fromHash >= 0) openPage(fromHash);
else showHome();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
