<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12002a">
<meta name="description" content="Soivat Sivut – värikäs musiikkikirja, eläinbileiden launchpad ja arvauspeli lapsille.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Soivat Sivut</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sun"></div>
<div id="sun2"></div>
<div id="glow"></div>
<canvas id="bg"></canvas>

<!-- ─── Kotisivu ─── -->
<main id="home" class="screen">
  <button class="iconbtn stopall corner" aria-label="Pysäytä kaikki silmukat" hidden>⏹</button>
  <h1 class="logo" aria-label="Soivat Sivut"></h1>
  <p class="tagline">Soita, miksaa ja bilettä eläinten kanssa! 🎶</p>
  <div class="bigbtns">
    <button class="bigbtn party" id="lpBtn"><span class="art">🎛️</span>Eläinbileet</button>
    <button class="bigbtn game" id="gameBtn"><span class="art">❓</span>Arvauspeli</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- ─── Eläinbileet: launchpad ─── -->
<section id="lp" class="screen" hidden>
  <div class="top">
    <div class="group">
      <button class="iconbtn" data-home aria-label="Kotiin">🏠</button>
      <button class="iconbtn stopall" aria-label="Pysäytä kaikki silmukat" hidden>⏹</button>
    </div>
    <div class="stylesw" role="group" aria-label="Musiikkityyli">
      <button data-style="pop">POP</button>
      <button data-style="tekno">TEKNO</button>
    </div>
    <div class="group">
      <button class="iconbtn mute" aria-label="Ääni päälle tai pois">🔊</button>
    </div>
  </div>
  <div class="lpmain">
    <div class="deck" id="deck">
      <div class="vinyl" id="vinyl"><span class="vlabel" id="vlabel">🎛️</span></div>
      <div class="orbit" id="orbit"></div>
      <div class="deckhint" id="deckhint">Paina ylärivin nappeja ja tee biisi! 🎵</div>
    </div>
    <div class="lpgrids">
      <div class="lpgrid loops" id="lpLoops"></div>
      <div class="lpgrid animals" id="lpAnimals"></div>
    </div>
  </div>
</section>

<!-- ─── Soitinsivu ─── -->
<section id="book" class="screen" hidden>
  <div class="top">
    <div class="group">
      <button class="iconbtn" data-home aria-label="Kotiin">🏠</button>
      <button class="iconbtn stopall" aria-label="Pysäytä kaikki silmukat" hidden>⏹</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="group">
      <button class="iconbtn speak" aria-label="Puhe päälle tai pois" hidden>🗣️</button>
      <button class="iconbtn mute" aria-label="Ääni päälle tai pois">🔊</button>
    </div>
  </div>
  <div class="bookmain">
    <div class="middle" id="middle">
      <button class="navbtn" id="prev" aria-label="Edellinen sivu">‹</button>
      <div class="stagewrap" id="stagewrap">
        <h2 class="name" id="name"></h2>
        <button class="stage" id="stage" aria-label="Soita kappale">
          <span class="ring1"></span>
          <span class="ring2"></span>
          <span class="disc"><span class="artwrap" id="artwrap"><span class="art" id="art"></span></span></span>
          <span class="say" id="say"></span>
        </button>
        <div class="hint" id="hint">👆 Paina soitinta!</div>
      </div>
      <button class="navbtn" id="next" aria-label="Seuraava sivu">›</button>
    </div>
    <div class="launchpad" id="pads"></div>
  </div>
</section>

<!-- ─── Arvauspeli ─── -->
<section id="quiz" class="screen" hidden>
  <div class="top">
    <div class="group">
      <button class="iconbtn" data-home aria-label="Kotiin">🏠</button>
    </div>
    <div class="score" id="score" role="img" aria-label="Tähdet"></div>
    <div class="group">
      <button class="iconbtn" id="levelBtn" aria-label="Vaihda vaikeustaso">🐣</button>
      <button class="iconbtn mute" aria-label="Ääni päälle tai pois">🔊</button>
    </div>
  </div>
  <div class="middle">
    <div class="stagewrap">
      <h2 class="name" id="qtitle">Mikä soitin soi?</h2>
      <button class="stage qstage" id="qstage" aria-label="Kuuntele uudestaan">
        <span class="ring1"></span>
        <span class="ring2"></span>
        <span class="disc"><span class="artwrap" id="qartwrap"><span class="art" id="qart"></span></span></span>
        <span class="replay" aria-hidden="true">🔁</span>
      </button>
    </div>
    <div class="feedback"><div class="fb" id="fb"></div></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="levels" id="levels" hidden>
    <h2 class="name">Valitse taso</h2>
    <button class="level" data-level="easy"><span class="art">🐣</span><b>Helppo</b><small>Kuka ääntelee? Eläimet</small></button>
    <button class="level" data-level="medium"><span class="art">🐥</span><b>Keskitaso</b><small>Mikä soitin soi?</small></button>
    <button class="level" data-level="hard"><span class="art">🦉</span><b>Vaikea</b><small>Soittimet ja eläimet, 6 vaihtoehtoa</small></button>
  </div>
</section>

<div id="start"><button aria-label="Aloita"><span class="play"></span></button></div>

<canvas id="fx"></canvas>

<script src="js/audio.js"></script>
<script src="js/animals.js"></script>
<script src="js/music.js"></script>
<script src="js/visuals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
