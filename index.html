<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0018">
<meta name="description" content="Biittipad – tee phonkia, technoa, housea, trappia, drum & bassia ja lo-fia koskettamalla.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Biittipad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sun"></div>
<div id="sun2"></div>
<div id="glow"></div>
<canvas id="bg"></canvas>

<main id="app" class="screen">
  <header class="top">
    <div class="brand">BIITTI<b>PAD</b></div>
    <div class="group">
      <button class="iconbtn" id="jamBtn" aria-label="Arvo biitti">🎲</button>
      <button class="iconbtn stopall" id="stopBtn" aria-label="Pysäytä kaikki" hidden>⏹</button>
      <button class="iconbtn" id="muteBtn" aria-label="Ääni päälle tai pois">🔊</button>
    </div>
  </header>
  <nav class="genres" id="genres" aria-label="Tyyli"></nav>
  <div class="main">
    <div class="left">
      <div class="viz" id="vizbox">
        <canvas id="viz"></canvas>
        <div class="vizinfo">
          <span class="gname" id="gname"></span>
          <span class="bpm" id="bpmLabel"></span>
          <span class="beats" id="beats"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="hint" id="hint">Napauta pädejä ja rakenna biitti 👇</div>
      </div>
      <div class="pads">
        <div class="grid" id="grid"></div>
        <div class="shots" id="shots"></div>
      </div>
    </div>
    <div class="fxpanel">
      <div class="xy" id="xy" aria-label="Suodin: vedä sormella">
        <span class="xylabel">FILTER</span>
        <span class="xyl">LOW</span>
        <span class="xyr">HIGH</span>
        <span class="xydot" id="xydot"></span>
      </div>
      <div class="fxbtns">
        <button class="fxbtn" data-fx="gate" style="--h:190">GATE</button>
        <button class="fxbtn" data-fx="echo" style="--h:280">ECHO</button>
        <button class="fxbtn" data-fx="break" style="--h:0">BREAK</button>
      </div>
    </div>
  </div>
</main>

<div id="start"><button aria-label="Aloita"><span class="play"></span></button><p>BIITTIPAD</p></div>

<canvas id="fx"></canvas>

<script src="js/audio.js"></script>
<script src="js/vox.js"></script>
<script src="js/genres.js"></script>
<script src="js/sequencer.js"></script>
<script src="js/visuals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
